[workspace]
members = [
    "crates/ikaros-domain",
    "crates/ikaros-usecase",
    "crates/ikaros-adb",
    "crates/ikaros-app",
]
resolver = "2"

[workspace.dependencies]
# 异步运行时与并发
tokio = { version = "1.44", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# 错误处理与日志
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# 序列化与工具
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# UI 框架
slint = "1.18.1"
slint-build = "1.18.1"

# Workspace 内部子 Crate
ikaros-domain = { path = "crates/ikaros-domain" }
ikaros-usecase = { path = "crates/ikaros-usecase" }
ikaros-adb = { path = "crates/ikaros-adb" }
